<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>레시피</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- P1: 여기에 레시피를 씁니다 -->
   <h1 id="title"> 봉골레 파스타</h1>
   <p class="summary">바지락의 <strong>짭조름한 바다 향</strong>을 마늘과 화이트와인으로 살린 <em>이탈리아식</em>파스타.</string></p>
   <img src="images/vongole.jpg" alt="바지락과 파슬리를 올린 스파게티 한 접시" width="480">

   <h2>정보</h2>
   <table>
      <tr><th>분량</th><th>시간</th><th>난이도</th></tr>
      <tr><td>2인분</td><td>25분</td><td>보통</td></tr>
   </table>

   <h2>재료</h2>
   <ul>
      <li>스파게티 200g</li>
      <li>해감한 바지랅 400g</li>
      <li>소금 8g</li>
      <li>마늘</li>
   </ul>

   <h2>만드는 순서</h2>
   <ol>
      <li>소금을 넣은 물을 끓여 면을 삶는다.</li>
      <li>프라이팬에 올리브유를 두르고 마늘을 익힌다.</li>
      <li>익힌 모든 재료를 프라이팬에 넣는다.</li>
      <li>간을 한다.</li>
   </ol>
   <p>더 알아보기: <a href="https://ko.wikipedia.org/wiki/스파게티_알레_봉골레">위키백과 스파게티 알레 봉골레</a></p>
</body>
</html>
